name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: brew install jolt-lang/jolt/jolt
      - name: Run tests
        run: jolt -M:test

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jolt
        run: |
          curl -sSL -o jolt.tar.gz \
            https://github.com/jolt-lang/jolt/releases/download/v0.8.15/jolt-v0.8.15-x86_64-linux.tar.gz
          mkdir -p "$HOME/.local/bin" /tmp/jolt-extract
          tar -xzf jolt.tar.gz -C /tmp/jolt-extract
          find /tmp/jolt-extract -name jolt -type f -exec install -m 755 {} "$HOME/.local/bin/jolt" \;
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: jolt -M:test
